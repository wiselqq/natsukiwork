<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subaru Hub // Core</title>
    <style>
        :root {
            --primary: #00ff66;
            --secondary: #ff6f00;
            --bg-glow: rgba(0, 255, 102, 0.3);
            --card-bg: rgba(5, 10, 5, 0.85);
            --border-color: rgba(0, 255, 102, 0.3);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #030503;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease, color 0.4s ease;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .top-bar, .view-section, .footer-bar {
            position: relative;
            z-index: 2;
        }

        .top-bar {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--primary);
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--bg-glow);
            transition: color 0.4s ease;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 2s infinite ease-in-out;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 15px var(--primary); }
        }

        .view-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .view-section.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .title {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 14px;
            margin: 0;
            color: var(--primary);
            text-transform: lowercase;
            padding-left: 14px;
            text-shadow: 0 0 15px var(--bg-glow);
            transition: color 0.4s ease;
        }

        .title span {
            color: var(--secondary);
            text-shadow: 0 0 15px var(--secondary);
            transition: color 0.4s ease;
        }

        .section-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 26px;
            letter-spacing: 8px;
            color: var(--primary);
            text-transform: lowercase;
            margin-bottom: 15px;
            text-shadow: 0 0 12px var(--bg-glow);
            transition: color 0.4s ease;
        }

        .search-box {
            width: 100%;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            letter-spacing: 1.5px;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--bg-glow), inset 0 0 10px var(--bg-glow);
            transform: translateY(-2px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            padding: 10px;
        }

        .footer-bar {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .menu-container {
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .menu-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-btn svg {
            fill: var(--primary);
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 0 6px var(--bg-glow));
            transition: transform 0.3s ease, fill 0.4s ease;
        }

        .menu-container:hover .menu-btn {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--bg-glow);
            transform: scale(1.08);
        }

        .menu-container:hover .menu-btn svg {
            transform: rotate(90deg);
        }

        .dropdown-menu {
            display: flex;
            position: absolute;
            bottom: calc(100% + 20px);
            left: 50%;
            flex-direction: column;
            gap: 8px;
            background: rgba(3, 5, 3, 0.95);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.95), 0 0 20px var(--bg-glow);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translate(-50%, 10px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s, visibility 0.3s ease 0.15s;
            visibility: hidden;
        }

        .dropdown-menu::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 35px;
            background: transparent;
        }

        .menu-container:hover .dropdown-menu {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
            pointer-events: auto;
            visibility: visible;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        }

        .icon-link {
            background: transparent;
            border: 1px solid transparent;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-link svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
            transition: fill 0.4s ease;
        }

        .icon-link:hover {
            background-color: var(--bg-glow);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--bg-glow);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Space-time Gravity Blanket Canvas -->
    <canvas id="space-canvas"></canvas>

    <div class="top-bar">
        <div class="top-status">
            <div class="pulse-dot"></div>
            <div id="sys-status-text">SYS.GRID // ACTIVE</div>
        </div>
        <div id="live-clock">00:00:00</div>
    </div>

    <!-- HOME VIEW -->
    <div id="view-home" class="view-section active">
        <h1 class="title"><span id="title-part1">subaru</span><span id="title-part2">hub</span></h1>
    </div>

    <!-- GAMES VIEW -->
    <div id="view-games" class="view-section">
        <div class="section-header">
            <div class="section-title">games</div>
            <input type="text" class="search-box" placeholder="search game nodes..." onkeyup="filterGrid(this, 'games-grid')">
        </div>
        <div id="games-grid" class="grid-container">
            <!-- Items cleared for manual addition -->
        </div>
    </div>

    <!-- APPS VIEW -->
    <div id="view-apps" class="view-section">
        <div class="section-header">
            <div class="section-title">apps</div>
            <input type="text" class="search-box" placeholder="search tool database..." onkeyup="filterGrid(this, 'apps-grid')">
        </div>
        <div id="apps-grid" class="grid-container">
            <!-- Items cleared for manual addition -->
        </div>
    </div>

    <!-- BROWSER VIEW -->
    <div id="view-browser" class="view-section">
        <div class="section-header">
            <div class="section-title">gateway browser</div>
            <input type="text" class="search-box" placeholder="enter destination URL or query..." onkeypress="handleBrowserSearch(event)">
        </div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-top: 20px;">
            type query above and press enter to route externally
        </div>
    </div>

    <!-- FOOTER MENU -->
    <div class="footer-bar">
        <div class="menu-container">
            <button class="menu-btn">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
            <div class="dropdown-menu">
                <button class="icon-link" title="Home" onclick="switchView('home')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </button>
                <button class="icon-link" title="Games" onclick="switchView('games')">
                    <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </button>
                <button class="icon-link" title="Apps" onclick="switchView('apps')">
                    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4H4v4zm-6 4h4V4H4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                </button>
                <button class="icon-link" title="Browser" onclick="switchView('browser')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
