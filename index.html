<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re:Zero Interactive Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0b0f;
            color: #ffffff;
            transition: background 0.5s ease;
        }

        /* Dynamic Background Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Main Container */
        .hub-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
            padding: 30px 50px;
            position: relative;
            z-index: 2;
        }

        /* Header UI */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Customization & Status Panel */
        .status-panel {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(15, 15, 25, 0.6);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        select {
            background: #1a1a2e;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        /* Center Character & Selection Display */
        .main-stage {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-grow: 1;
            padding: 0 40px;
        }

        .character-info {
            max-width: 400px;
            animation: fadeIn 0.5s ease;
        }

        .character-info h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .character-info p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .character-display {
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .character-display img {
            max-height: 100%;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .character-display img:hover {
            transform: scale(1.03);
        }

        /* Character Navigation Bar */
        .character-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .char-btn {
            background: rgba(30, 30, 45, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .char-btn:hover, .char-btn.active {
            background: #7c3aed;
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            transform: translateY(-3px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="hub-container">
        <!-- Header -->
        <header>
            <div class="logo">Re:Zero Hub</div>
            <div class="status-panel">
                <div class="control-group">
                    <label for="bgMode">BG FX:</label>
                    <select id="bgMode">
                        <option value="magnet">Magnet Particles</option>
                        <option value="space">Classic Space Warp</option>
                        <option value="matrix">Digital Rain</option>
                        <option value="float">Floating Dust</option>
                    </select>
                </div>
                <div class="control-group" id="timeDisplay">12:00 AM</div>
            </div>
        </header>

        <!-- Main Content Stage -->
        <div class="main-stage">
            <div class="character-info" id="charInfo">
                <h1 id="charName">Subaru</h1>
                <p id="charDesc">The ordinary high schooler summoned into a fantasy world, wielding the agonizing power of Return by Death.</p>
            </div>
            <div class="character-display">
                <img id="charImage" src="18911_2.webp" alt="Character">
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="character-nav">
            <button class="char-btn active" onclick="switchCharacter(0)">Subaru Natsuki</button>
            <button class="char-btn" onclick="switchCharacter(1)">Emilia</button>
            <button class="char-btn" onclick="switchCharacter(2)">Reinhard van Astrea</button>
            <button class="char-btn" onclick="switchCharacter(3)">Satella</button>
        </div>
    </div>

    <script>
        // Character Data Array
        const characters = [
            {
                name: "Subaru Natsuki",
                desc: "The ordinary high schooler summoned into a fantasy world, wielding the agonizing power of Return by Death.",
                image: "18911_2.webp",
                theme: "#0b0b0f"
            },
            {
                name: "Emilia",
                desc: "The half-elf candidate for the Lugunica throne, bound to the Great Spirit Puck, protected by pale white and purple aesthetics.",
                image: "18912_2.png",
                theme: "#f8f9fa",
                customBg: "emilia"
            },
            {
                name: "Reinhard van Astrea",
                desc: "The legendary Sword Saint and Knight of Knights, widely considered the strongest character in the entire universe.",
                image: "18913_2.webp",
                theme: "#0b0b0f"
            },
            {
                name: "Satella",
                desc: "The Witch of Envy, infamous for destroying half the world, wrapped in shadows and an undying fixation.",
                image: "18914_2.webp",
                theme: "#050208"
            }
        ];

        let currentIndex = 0;

        function switchCharacter(index) {
            currentIndex = index;
            const char = characters[index];
            
            document.getElementById('charName').innerText = char.name;
            document.getElementById('charDesc').innerText = char.desc;
            document.getElementById('charImage').src = char.image;

            // Handle Emilia specific background override
            if (char.customBg === "emilia") {
                document.body.style.backgroundColor = "#f4f1f8";
                document.getElementById('charName').style.color = "#4c1d95";
                document.getElementById('charDesc').style.color = "#6b7280";
            } else {
                document.body.style.backgroundColor = char.theme;
                document.getElementById('charName').style.color = "#ffffff";
                document.getElementById('charDesc').style.color = "#cbd5e1";
            }

            document.querySelectorAll('.char-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }

        // Live Clock (Replacing non-functional battery tracker)
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Advanced Interactive Canvas Background System
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        // Particle System
        let particles = [];
        const particleCount = 120;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2.5 + 1;
                this.locked = false;
                this.baseAlpha = Math.random() * 0.5 + 0.3;
            }
            update(mode) {
                if (mode === 'magnet') {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150 && dist > 10) {
                        // Magnet pull effect
                        this.x += dx * 0.05;
                        this.y += dy * 0.05;
                    } else if (dist <= 10) {
                        // Lock in place until disturbance
                        this.locked = true;
                    }

                    if (dist > 300) {
                        this.locked = false;
                    }

                    if (!this.locked) {
                        this.x += this.vx;
                        this.y += this.vy;
                    }
                } else if (mode === 'space') {
                    this.x += this.vx * 2;
                    this.y += this.vy * 2;
                } else if (mode === 'matrix') {
                    this.y += this.size * 2;
                    if (this.y > canvas.height) this.y = 0;
                } else {
                    // Float mode
                    this.x += this.vx * 0.5;
                    this.y += this.vy * 0.5;
                }

                // Screen bounds wrapping
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw(mode) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                if (characters[currentIndex].customBg === 'emilia') {
                    ctx.fillStyle = `rgba(124, 58, 237, ${this.baseAlpha})`;
                } else {
                    ctx.fillStyle = mode === 'matrix' ? `rgba(52, 211, 153, ${this.baseAlpha})` : `rgba(167, 139, 250, ${this.baseAlpha})`;
                }
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();

        function animate() {
            const mode = document.getElementById('bgMode').value;
            
            if (characters[currentIndex].customBg === 'emilia') {
                ctx.fillStyle = "rgba(244, 241, 248, 0.2)";
            } else {
                ctx.fillStyle = "rgba(11, 11, 15, 0.25)";
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update(mode);
                p.draw(mode);
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
