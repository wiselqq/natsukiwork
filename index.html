<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subaru</title>
    <style>
        :root {
            --bg-primary: #070913;
            --bg-card: rgba(18, 24, 38, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1100px;
        }

        .widget-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 340px;
            position: relative;
            backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .widget-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .widget-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #64748b;
            border-radius: 50%;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .widget-card.active .status-dot {
            background-color: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        .stage {
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .widget-footer {
            font-size: 0.75rem;
            color: #475569;
            text-align: center;
            transition: color 0.3s ease;
        }

        .widget-card:hover .widget-footer {
            color: var(--text-muted);
        }

        /* --- ELEMENT 1: GLITCH PRISM --- */
        .prism-shape {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(59, 130, 246, 0.15));
            border: 2px solid #38bdf8;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            transition: clip-path 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease, border-color 0.4s ease;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .widget-card.prism-active .prism-shape {
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            border-color: #f43f5e;
            transform: rotate(180deg) scale(1.15);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.35);
        }

        /* --- ELEMENT 2: LIQUID MERCURY --- */
        .mercury-blob {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #94a3b8 40%, #1e293b 100%);
            border-radius: 50%;
            box-shadow: inset -4px -4px 12px rgba(0,0,0,0.7), 0 8px 16px rgba(0,0,0,0.4);
            transition: border-radius 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), transform 0.4s ease;
        }

        .widget-card.mercury-active .mercury-blob {
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            transform: scale(1.3) translateY(-4px);
            animation: squish 0.6s ease infinite alternate;
        }

        @keyframes squish {
            0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: scale(1.3) rotate(0deg); }
            100% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: scale(1.15) rotate(15deg); }
        }

        /* --- ELEMENT 3: NEON CORE & RINGS --- */
        .neon-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-core {
            width: 26px;
            height: 26px;
            background: #22d3ee;
            border-radius: 50%;
            box-shadow: 0 0 12px #22d3ee, 0 0 24px #22d3ee;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        .neon-ring {
            position: absolute;
            border: 2px dashed rgba(34, 211, 238, 0.35);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .ring-1 { width: 56px; height: 56px; animation: spin-slow 8s linear infinite; }
        .ring-2 { width: 80px; height: 80px; border-style: solid; border-color: rgba(34, 211, 238, 0.1); border-top-color: #22d3ee; animation: spin-fast 4s linear infinite reverse; }

        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes spin-fast { 100% { transform: rotate(360deg); } }

        .widget-card.neon-active .neon-core {
            transform: scale(1.6);
            background: #f472b6;
            box-shadow: 0 0 20px #f472b6, 0 0 40px #f472b6;
        }

        .widget-card.neon-active .ring-1 {
            border-color: rgba(244, 114, 182, 0.7);
            transform: scale(1.15);
        }

        .widget-card.neon-active .ring-2 {
            border-top-color: #f472b6;
            border-color: rgba(244, 114, 182, 0.25);
            transform: scale(0.9);
        }

        /* --- ELEMENT 4: VOID RIFT --- */
        .void-stage {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .void-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
            z-index: 2;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .void-shard {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: #c084fc;
            border-radius: 50%;
            transform-origin: -30px center;
            animation: orbit 3s linear infinite;
        }

        .void-shard:nth-child(2) { animation-delay: -0.75s; transform-origin: -38px center; background: #e879f9; }
        .void-shard:nth-child(3) { animation-delay: -1.5s; transform-origin: -22px center; background: #818cf8; }
        .void-shard:nth-child(4) { animation-delay: -2.25s; transform-origin: -44px center; background: #c084fc; }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(0) scale(1); opacity: 0.8; }
            50% { opacity: 0.3; scale: 0.5; }
            100% { transform: rotate(360deg) translateX(0) scale(1); opacity: 0.8; }
        }

        .widget-card.void-active .void-shard {
            animation-duration: 0.35s;
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff;
        }

        .widget-card.void-active .void-center {
            transform: translate(-50%, -50%) scale(1.9);
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.9);
        }
    </style>
</head>
<body>

    <header>
        <h1>Subaru</h1>
        <p>Click any module card to trigger its unique transformation sequence.</p>
    </header>

    <div class="dashboard-grid">
        <!-- Card 1: Glitch Prism -->
        <div class="widget-card" id="prismCard">
            <div class="widget-header">
                <span class="widget-title">Glitch Prism</span>
                <div class="status-dot"></div>
            </div>
            <div class="stage">
                <div class="prism-shape"></div>
            </div>
            <div class="widget-footer">Module 01 • Morph State</div>
        </div>

        <!-- Card 2: Liquid Mercury -->
        <div class="widget-card" id="mercuryCard">
            <div class="widget-header">
                <span class="widget-title">Liquid Mercury</span>
                <div class="status-dot"></div>
            </div>
            <div class="stage">
                <div class="mercury-blob"></div>
            </div>
            <div class="widget-footer">Module 02 • Fluid Dynamics</div>
        </div>

        <!-- Card 3: Neon Core -->
        <div class="widget-card" id="neonCard">
            <div class="widget-header">
                <span class="widget-title">Neon Core</span>
                <div class="status-dot"></div>
            </div>
            <div class="stage">
                <div class="neon-container">
                    <div class="neon-ring ring-1"></div>
                    <div class="neon-ring ring-2"></div>
                    <div class="neon-core"></div>
                </div>
            </div>
            <div class="widget-footer">Module 03 • Energy Sync</div>
        </div>

        <!-- Card 4: Void Rift -->
        <div class="widget-card" id="voidCard">
            <div class="widget-header">
                <span class="widget-title">Void Rift</span>
                <div class="status-dot"></div>
            </div>
            <div class="stage">
                <div class="void-stage">
                    <div class="void-center"></div>
                    <div class="void-shard" style="transform: rotate(0deg);"></div>
                    <div class="void-shard" style="transform: rotate(90deg);"></div>
                    <div class="void-shard" style="transform: rotate(180deg);"></div>
                    <div class="void-shard" style="transform: rotate(270deg);"></div>
                </div>
            </div>
            <div class="widget-footer">Module 04 • Gravitational Pulse</div>
        </div>
    </div>

    <script>
        const cards = document.querySelectorAll('.widget-card');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('active');
                
                if (card.id === 'prismCard') card.classList.toggle('prism-active');
                if (card.id === 'mercuryCard') card.classList.toggle('mercury-active');
                if (card.id === 'neonCard') card.classList.toggle('neon-active');
                if (card.id === 'voidCard') card.classList.toggle('void-active');
            });
        });
    </script>
</body>
</html>
