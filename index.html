<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subaru Hub // Core</title>
    <style>
        :root {
            --primary: #cccccc;
            --secondary: #888888;
            --bg-glow: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(15, 15, 15, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0c0c0c;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease, color 0.4s ease;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .top-bar, .view-section, .footer-bar, .modal-overlay {
            position: relative;
            z-index: 2;
        }

        .top-bar {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--primary);
            letter-spacing: 2px;
            transition: color 0.4s ease;
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
            transition: background-color 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .view-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .view-section.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .avatar-container {
            position: relative;
            margin-bottom: 20px;
            animation: floatAnim 4s ease-in-out infinite;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .avatar {
            width: 130px;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: filter 0.4s ease;
        }

        .title {
            font-size: 38px;
            font-weight: 300;
            letter-spacing: 14px;
            margin: 0;
            color: var(--primary);
            text-transform: lowercase;
            padding-left: 14px;
            transition: color 0.4s ease;
        }

        .title span {
            color: var(--secondary);
            transition: color 0.4s ease;
        }

        .subtitle {
            font-size: 11px;
            color: var(--primary);
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: color 0.4s ease;
        }

        .section-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 26px;
            letter-spacing: 8px;
            color: var(--primary);
            text-transform: lowercase;
            margin-bottom: 15px;
            transition: color 0.4s ease;
        }

        .search-box {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            letter-spacing: 1.5px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-box:focus {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            padding: 10px;
        }

        .grid-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .grid-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            background: rgba(25, 25, 25, 0.9);
        }

        .grid-card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--primary);
        }

        .grid-card p {
            margin: 0;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-bar {
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .menu-container {
            position: relative;
            display: inline-block;
            padding-bottom: 10px;
            margin-bottom: -10px;
        }

        .menu-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-btn svg {
            fill: var(--primary);
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease, fill 0.4s ease;
        }

        .menu-container:hover .menu-btn {
            border-color: var(--primary);
            transform: scale(1.08);
        }

        .menu-container:hover .menu-btn svg {
            transform: rotate(90deg);
        }

        .dropdown-menu {
            display: flex;
            position: absolute;
            bottom: calc(100% + 20px);
            left: 50%;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translate(-50%, 10px) scale(0.95);
            pointer-events: none;
            transition: opacity 0.3s ease 0.15s, transform 0.3s ease 0.15s, visibility 0.3s ease 0.15s;
            visibility: hidden;
        }

        .dropdown-menu::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 35px;
            background: transparent;
        }

        .menu-container:hover .dropdown-menu {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
            pointer-events: auto;
            visibility: visible;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        }

        .icon-link {
            background: transparent;
            border: 1px solid transparent;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-link svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
            transition: fill 0.4s ease;
        }

        .icon-link:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* REBUILT CLEAN MODERN SETTINGS MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(18, 18, 18, 0.98);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            width: 92%;
            max-width: 580px;
            max-height: 88vh;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transform: scale(0.96);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            color: #ffffff;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
        }

        .modal-title {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--primary);
            margin: 0;
            text-transform: lowercase;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .modal-body-scroll {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding-right: 4px;
        }

        .modal-body-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 3px;
        }
        .modal-body-scroll::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
        }

        .setting-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .setting-label::before {
            content: '//';
            color: var(--primary);
        }

        .character-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .char-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            transition: all 0.25s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .char-btn span {
            font-size: 9px;
            opacity: 0.4;
            letter-spacing: 1px;
        }

        .char-btn:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
        }

        .char-btn.active {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .char-btn.active span {
            opacity: 0.9;
            color: var(--primary);
        }

        .slider-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
        }

        .custom-slider {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .physics-select-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 8px;
        }

        .physics-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .physics-btn .phys-title {
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }

        .physics-btn .phys-desc {
            font-size: 9px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        .physics-btn:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .physics-btn.active {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .physics-btn.active .phys-title {
            color: var(--primary);
        }

        .toggle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .toggle-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            text-align: center;
        }

        .toggle-btn.active {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .action-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 14px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .modal-footer-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
        }

        .btn-apply {
            flex: 1.5;
            background: #e0e0e0;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-apply:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            flex: 1;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-cancel:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <!-- Space-time Gravity Blanket Canvas -->
    <canvas id="space-canvas"></canvas>

    <div class="top-bar">
        <div class="top-status">
            <div class="pulse-dot"></div>
            <div id="sys-status-text">SYS.GRID // ACTIVE</div>
        </div>
        <div id="live-clock">00:00:00</div>
    </div>

    <!-- HOME VIEW -->
    <div id="view-home" class="view-section active">
        <div class="avatar-container">
            <img id="active-avatar" class="avatar" src="" alt="Character Render">
        </div>
        <h1 class="title"><span id="title-part1"></span><span id="title-part2"></span></h1>
        <div id="active-subtitle" class="subtitle"></div>
    </div>

    <!-- GAMES VIEW -->
    <div id="view-games" class="view-section">
        <div class="section-header">
            <div class="section-title">games</div>
            <input type="text" class="search-box" placeholder="search game nodes..." onkeyup="filterGrid(this, 'games-grid')">
        </div>
        <div id="games-grid" class="grid-container">
            <!-- Items cleared for manual addition -->
        </div>
    </div>

    <!-- APPS VIEW -->
    <div id="view-apps" class="view-section">
        <div class="section-header">
            <div class="section-title">apps</div>
            <input type="text" class="search-box" placeholder="search tool database..." onkeyup="filterGrid(this, 'apps-grid')">
        </div>
        <div id="apps-grid" class="grid-container">
            <!-- Items cleared for manual addition -->
        </div>
    </div>

    <!-- BROWSER VIEW -->
    <div id="view-browser" class="view-section">
        <div class="section-header">
            <div class="section-title">gateway browser</div>
            <input type="text" class="search-box" placeholder="enter destination URL or query..." onkeypress="handleBrowserSearch(event)">
        </div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-top: 20px;">
            type query above and press enter to route externally
        </div>
    </div>

    <!-- FOOTER MENU -->
    <div class="footer-bar">
        <div class="menu-container">
            <button class="menu-btn">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
            <div class="dropdown-menu">
                <button class="icon-link" title="Home" onclick="switchView('home')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </button>
                <button class="icon-link" title="Games" onclick="switchView('games')">
                    <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </button>
                <button class="icon-link" title="Apps" onclick="switchView('apps')">
                    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4H4v4zm-6 4h4V4H4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                </button>
                <button class="icon-link" title="Browser" onclick="switchView('browser')">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </button>
                <button class="icon-link" title="Settings" onclick="openSettingsModal()">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c-.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c-.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- CLEANED SETTINGS MODAL WITH NEW PHYSICS MODES -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">system configuration & parameters</h2>
                <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            </div>

            <div class="modal-body-scroll">
                <div class="setting-group">
                    <div class="setting-label">Character Interface Protocol</div>
                    <div class="character-select-grid" id="modal-char-grid">
                        <button class="char-btn" onclick="stageTheme('subaru', this)">Subaru <span>[core]</span></button>
                        <button class="char-btn" onclick="stageTheme('reinhard', this)">Reinhard <span>[sword]</span></button>
                        <button class="char-btn" onclick="stageTheme('emilia', this)">Emilia <span>[frost]</span></button>
                        <button class="char-btn" onclick="stageTheme('satella', this)">Satella <span>[envy]</span></button>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-label">Gravity Blanket Grid Density</div>
                    <div class="slider-container">
                        <div class="slider-info">
                            <span>Resolution Scale</span>
                            <span id="grid-val">45px</span>
                        </div>
                        <input type="range" id="modal-slider" min="25" max="80" step="5" value="45" class="custom-slider" oninput="stageSpacing(this.value)">
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-label">Interface Physics & Distortion Mode</div>
                    <div class="physics-select-grid" id="modal-physics-grid">
                        <button class="physics-btn" onclick="stagePhysics('warp', this)">
                            <div class="phys-title">Standard Warp <span>[Smooth Pull]</span></div>
                            <div class="phys-desc">Classic fluid gravitational pull towards cursor proximity.</div>
                        </button>
                        <button class="physics-btn" onclick="stagePhysics('magnetic', this)">
                            <div class="phys-title">Magnetic Powder <span>[Inertial Drag]</span></div>
                            <div class="phys-desc">Custom shape particles get pulled to cursor and lag behind if you move too fast.</div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="modal-footer-actions">
                <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
                <button class="btn-apply" onclick="applySettings()">Apply Changes</button>
            </div>
        </div>
    </div>

</body>
</html>
