<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Background & Character Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(10, 10, 10, 0.85);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        select {
            background: #050505;
            color: #ff3333;
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 8px 14px;
            border-radius: 2px;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        select:hover {
            border-color: #ff3333;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
        }
        .system-status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 0, 0, 0.7);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 5;
        }

        /* Center Character / Word Container */
        .content-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            gap: 20px;
        }

        .character-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .character-wrapper img {
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }

        .description-word {
            color: #ff3333;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
            transition: font-size 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="system-status" style="display: none;">SYS.GRID // ACTIVE</div>

    <div class="ui-container">
        <select id="animationSelect">
            <option value="standardWarp">Standard Warp</option>
            <option value="magneticField">Magnetic Powder</option>
            <option value="cyberGrid">Cyber Grid</option>
            <option value="neonVortex">Neon Vortex</option>
        </select>
        <select id="characterSelect">
            <option value="character1">Character 1</option>
            <option value="character2">Character 2</option>
            <option value="character3">Character 3</option>
        </select>
    </div>

    <div class="content-display">
        <div class="character-wrapper" id="charWrapper">
            <img id="charImage" src="" alt="Character">
        </div>
        <div class="description-word" id="descWord">SWORD</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // Character configurations with individual sizing multipliers and unique scales
        const characters = {
            character1: {
                src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260" viewBox="0 0 180 260"><rect width="180" height="260" fill="none"/><circle cx="90" cy="70" r="35" fill="%23ff3333"/><path d="M50 120 L130 120 L140 240 L40 240 Z" fill="%23ffffff"/><polygon points="90,10 110,50 70,50" fill="%23ff9999"/></svg>',
                word: 'SWORD',
                scale: 1.6,       // Scaled up nicely
                fontSize: '16px'
            },
            character2: {
                src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260" viewBox="0 0 180 260"><rect width="180" height="260" fill="none"/><circle cx="90" cy="70" r="35" fill="%233388ff"/><path d="M40 130 L140 130 L120 250 L60 250 Z" fill="%23e0e0e0"/><polygon points="30,100 90,80 150,100" fill="%233388ff"/></svg>',
                word: 'MAGE',
                scale: 1.8,       // Slightly larger unique scale for visual balance
                fontSize: '18px'
            },
            character3: {
                src: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="260" viewBox="0 0 180 260"><rect width="180" height="260" fill="none"/><circle cx="90" cy="70" r="35" fill="%2333ff66"/><path d="M45 110 L135 110 L150 240 L30 240 Z" fill="%23111111"/><polygon points="90,20 120,60 60,60" fill="%2333ff66"/></svg>',
                word: 'ROGUE',
                scale: 1.5,       // Tailored custom scale
                fontSize: '15px'
            }
        };

        const charSelect = document.getElementById('characterSelect');
        const charImage = document.getElementById('charImage');
        const charWrapper = document.getElementById('charWrapper');
        const descWord = document.getElementById('descWord');

        function updateCharacter() {
            const config = characters[charSelect.value];
            charImage.src = config.src;
            descWord.textContent = config.word;
            descWord.style.fontSize = config.fontSize;
            
            // Apply distinct scaling factor based on active character selection
            charImage.style.width = `${160 * config.scale}px`;
            charImage.style.height = `${220 * config.scale}px`;
        }

        charSelect.addEventListener('change', updateCharacter);
        updateCharacter(); // Initialize default view

        // Canvas Background Animation Engine
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const select = document.getElementById('animationSelect');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, px: null, py: null, vx: 0, vy: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.px = mouse.x;
            mouse.py = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.vx = mouse.x - (mouse.px || mouse.x);
            mouse.vy = mouse.y - (mouse.py || mouse.y);
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
            mouse.vx = 0;
            mouse.vy = 0;
        });

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.size = Math.random() * 1.5 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 1 + 0.5;
                this.color = Math.random() > 0.8 ? '#ff3333' : 'rgba(255, 255, 255, 0.6)';
            }
            update(mode) {
                if (mode === 'standardWarp') {
                    this.y -= this.speed * 1.5;
                    this.x += Math.sin(this.angle) * 0.5;
                    this.angle += 0.02;
                    if (this.y < 0) {
                        this.y = height + 10;
                        this.x = Math.random() * width;
                    }
                } else if (mode === 'magneticField') {
                    if (mouse.x !== null && mouse.y !== null) {
                        let dx = mouse.x - this.x;
                        let dy = mouse.y - this.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let force = Math.min(500 / (dist + 40), 12);
                        
                        this.vx += (dx / dist) * force * 0.06 - mouse.vx * 0.04;
                        this.vy += (dy / dist) * force * 0.06 - mouse.vy * 0.04;
                    }
                    this.vx *= 0.90;
                    this.vy *= 0.90;
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                } else if (mode === 'cyberGrid') {
                    this.angle += 0.03;
                    this.y += Math.sin(this.angle) * 0.8;
                } else if (mode === 'neonVortex') {
                    let cx = width / 2;
                    let cy = height / 2;
                    let dx = this.x - cx;
                    let dy = this.y - cy;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let angle = Math.atan2(dy, dx) + 0.018;
                    let targetDist = dist - 0.7;
                    if (targetDist < 10) targetDist = Math.max(width, height) * 0.5;
                    
                    this.x = cx + Math.cos(angle) * targetDist;
                    this.y = cy + Math.sin(angle) * targetDist;
                }
            }
            draw(mode) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (mode === 'cyberGrid') {
                    ctx.rect(this.x, this.y, this.size * 1.5, this.size * 1.5);
                } else {
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                }
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            let count = Math.floor((width * height) / 14000);
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        initParticles();
        window.addEventListener('resize', initParticles);

        function animate() {
            let mode = select.value;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update(mode);
                p.draw(mode);
            });

            if (mode === 'cyberGrid') {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.06)';
                ctx.lineWidth = 1;
                for (let i = 0; i < particles.length; i += 5) {
                    for (let j = i + 1; j < i + 4 && j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        if (dx * dx + dy * dy < 4500) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
