<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subaru Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            
            background-image: 
                radial-gradient(circle, transparent 20%, #000000 20%, #000000 80%, transparent 80%, transparent),
                radial-gradient(circle, transparent 20%, #000000 20%, #000000 80%, transparent 80%, transparent),
                linear-gradient(#051a05 2px, transparent 2px),
                linear-gradient(90deg, #051a05 2px, transparent 2px);
            background-size: 30px 30px, 30px 30px, 30px 30px, 30px 30px;
            background-position: 0 0, 15px 15px, 0 0, 0 0;
        }

        .top-bar {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #00ff66;
            letter-spacing: 1.5px;
            box-sizing: border-box;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .top-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            transform: translateY(-10px);
        }

        .avatar-container {
            position: relative;
            margin-bottom: 20px;
        }

        .avatar {
            width: 130px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 255, 102, 0.25)) drop-shadow(0 0 10px rgba(255, 111, 0, 0.25)); 
        }

        .title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 10px;
            margin: 0;
            color: #00ff66;
            text-transform: lowercase;
            padding-left: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.25);
        }

        .title span {
            color: #ff6f00;
            text-shadow: 0 0 10px rgba(255, 111, 0, 0.3);
        }

        .subtitle {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .footer-bar {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            box-sizing: border-box;
        }

        .menu-container {
            position: relative;
            display: inline-block;
        }

        .menu-btn {
            background-color: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.15);
            transition: all 0.2s ease;
        }

        .menu-btn svg {
            fill: #00ff66;
            width: 20px;
            height: 20px;
            filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.4));
            transition: fill 0.2s;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            bottom: 56px;
            left: 0;
            flex-direction: column;
            gap: 6px;
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid rgba(0, 255, 102, 0.25);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 255, 102, 0.15);
            backdrop-filter: blur(8px);
        }

        .menu-container:hover .dropdown-menu {
            display: flex;
        }

        .menu-container:hover .menu-btn {
            background-color: rgba(0, 255, 102, 0.15);
            border-color: rgba(0, 255, 102, 0.6);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .icon-link {
            background: transparent;
            border: 1px solid transparent;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-link svg {
            width: 18px;
            height: 18px;
        }

        /* Green Theme Icons */
        .icon-link.green {
            color: #00ff66;
        }
        .icon-link.green svg {
            fill: #00ff66;
            filter: drop-shadow(0 0 4px rgba(0, 255, 102, 0.3));
        }
        .icon-link.green:hover {
            background-color: rgba(0, 255, 102, 0.12);
            border-color: rgba(0, 255, 102, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        /* Orange Theme Icons */
        .icon-link.orange {
            color: #ff6f00;
        }
        .icon-link.orange svg {
            fill: #ff6f00;
            filter: drop-shadow(0 0 4px rgba(255, 111, 0, 0.3));
        }
        .icon-link.orange:hover {
            background-color: rgba(255, 111, 0, 0.12);
            border-color: rgba(255, 111, 0, 0.4);
            box-shadow: 0 0 10px rgba(255, 111, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-status">
            <div class="pulse-dot"></div>
            <div>SYS.ONLINE</div>
        </div>
        <div id="live-clock">00:00:00</div>
    </div>

    <div class="main-content">
        <div class="avatar-container">
            <img class="avatar" src="https://a.storyblok.com/f/178900/1120x1760/ad01f9dc4e/re-zero-char1_subaru.webp/m/filters:quality(95)format(webp)" alt="Subaru Natsuki">
        </div>
        
        <h1 class="title">subaru <span>hub</span></h1>
        <div class="subtitle">terminal access interface</div>
    </div>

    <div class="footer-bar">
        <div class="menu-container">
            <button class="menu-btn">
                <!-- Home Icon Default -->
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </button>
            <div class="dropdown-menu">
                <!-- Home -->
                <a href="#" class="icon-link green" title="Home">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </a>
                <!-- Games -->
                <a href="#" class="icon-link orange" title="Games">
                    <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </a>
                <!-- Apps / Tools -->
                <a href="#" class="icon-link green" title="Apps">
                    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                </a>
                <!-- Browser / External Link -->
                <a href="#" class="icon-link orange" title="Browser">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Real-time clean clock for the top bar
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
