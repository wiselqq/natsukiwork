<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYS.GRID // Subaru Hub</title>
  <style>
    :root {
      --bg: #ffffff;
      --grid-dot: rgba(168, 85, 247, 0.15);
      --text: #3b3b4f;
      --accent: #a855f7;
      --border: #3b3b4f;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      width: 90%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .display-container {
      position: relative;
      padding: 20px;
      border: 1px dashed var(--border);
      background: rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Fixed character image styling */
    .character-img {
      width: 180px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .label-text {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--accent);
    }

    /* Clean, non-AI settings menu style */
    .settings-menu {
      position: fixed;
      bottom: 20px;
      background: #0d0d0f;
      border: 1px solid var(--border);
      color: #c0c0d0;
      font-family: 'Courier New', Courier, monospace;
      padding: 16px 24px;
      box-shadow: none;
      border-radius: 0px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .settings-menu h2 {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;
      border-bottom: none;
    }

    .settings-menu button {
      background: transparent;
      border: 1px solid #52527a;
      color: #e2e8f0;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .settings-menu button:hover {
      background: var(--accent);
      color: #0d0d0f;
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>SYS.GRID // ACTIVE</span>
    <span id="clock">18:17:06</span>
  </div>

  <div class="display-container">
    <!-- Updated with character graphic asset -->
    <img src="18915.webp" alt="Character Graphic" class="character-img">
    <div class="label-text">F R O S T</div>
  </div>

  <div class="settings-menu">
    <h2>CONFIG</h2>
    <button onclick="toggleGrid()">TOGGLE GRID</button>
    <button onclick="resetSystem()">RESET</button>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);

    function toggleGrid() {
      document.body.style.backgroundImage = document.body.style.backgroundImage === 'none' 
        ? 'radial-gradient(var(--grid-dot) 1px, transparent 1px)' 
        : 'none';
    }

    function resetSystem() {
      location.reload();
    }
  </script>

</body>
</html>
